<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Token Launch Radar</title>
    <script src="../data.js"></script>
    <link rel="stylesheet" href="4-app.css">
  </head>
  <body>
    <header class="shell masthead">
      <div class="title-line">
        <h1>Token Launch Radar</h1>
        <p id="snapshot-date"></p>
      </div>
      <nav aria-label="Radar pages">
        <a href="#/">Board</a>
        <a href="#/method">Method</a>
        <a href="#/census">Census</a>
        <a href="#/plan">Farm planner</a>
      </nav>
      <div id="summary">
        <dl class="kpis" id="kpis"></dl>
        <section class="model" aria-label="Value model">
          <p class="equation">
            Implied value = launch value × 12-month launch odds · <span id="formula"></span>
          </p>
          <div id="checks"></div>
        </section>
      </div>
    </header>
    <main class="shell" tabindex="-1">
      <h2 role="alert">Radar unavailable</h2>
      <p>Generate the dashboard with <code>pnpm radar</code> and reopen this page.</p>
    </main>
    <template id="plan-unavailable">
      <h2>Farm portfolio</h2>
      <p>Open a protocol from the board to see its deposit net and verdicts.</p>
    </template>
    <template id="board-filters">
      <form class="filters" aria-label="Board filters">
        <label class="field"
          >Search protocol<input type="search" name="q" autocomplete="off"></label
        >
        <label class="field"
          >Category<select name="cat">
            <option value="">All categories</option>
          </select></label
        >
        <label class="field"
          >Chain<select name="chain">
            <option value="">All chains</option>
          </select></label
        >
        <label class="toggle"><input type="checkbox" name="wl"> Watchlist only</label>
        <label class="field">Deposit<select name="deposit"></select></label>
        <div class="export">
          <a href="data:text/csv," download="radar.csv">CSV</a
          ><a href="data:application/json,%5B%5D" download="radar.json">JSON</a>
        </div>
        <output id="results" aria-live="polite"></output>
      </form>
    </template>
    <script src="5-extras.js"></script>
    <script src="2-core.js"></script>
    <script src="3-ui.js"></script>
  </body>
</html>
